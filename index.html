<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나의 빛나는 웹사이트</title>
    <!-- 예쁜 폰트 불러오기 -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        /* 전체 배경 설정 (고급스러운 다크 그라데이션) */
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #1e1e2f 0%, #2a2a40 100%);
            font-family: 'Outfit', sans-serif;
            color: #ffffff;
        }

        /* 가운데 투명한 유리 느낌의 카드 상자 */
        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px); /* 유리 질감 효과 */
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 50px 40px;
            text-align: center;
            max-width: 500px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
            animation: fadeIn 1s ease-out; /* 스르륵 나타나는 애니메이션 */
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 제목 (네온 그라데이션 글씨) */
        h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
            background: linear-gradient(to right, #00f2fe, #4facfe);
            -webkit-background-clip: text; /* 글씨에만 색깔 입히기 */
            -webkit-text-fill-color: transparent;
        }

        /* 설명 글씨 */
        p {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #b3b3cc;
            margin-bottom: 40px;
        }

        /* 예쁜 마법의 버튼 */
        .btn {
            background: linear-gradient(to right, #ff416c, #ff4b2b);
            color: white;
            border: none;
            padding: 15px 35px;
            font-size: 1.2rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease; /* 부드러운 움직임 */
            box-shadow: 0 10px 20px rgba(255, 65, 108, 0.3);
            text-decoration: none;
            display: inline-block;
        }

        /* 버튼에 마우스를 올렸을 때의 변화 */
        .btn:hover {
            transform: translateY(-5px); /* 위로 살짝 뜹니다 */
            box-shadow: 0 15px 25px rgba(255, 65, 108, 0.5); /* 그림자가 진해집니다 */
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Hello, Cloud! 🚀</h1>
        <p>밋밋했던 하얀 화면이 이렇게 멋지게 변했습니다. 로컬과 클라우드 서버 연동을 완벽하게 마친 당신을 환영합니다!</p>
        <!-- 버튼을 누르면 알림창(JS)이 뜹니다 -->
        <a href="#" class="btn" onclick="alert('멋진 버튼을 클릭하셨군요! 환영합니다!')">마법의 버튼 클릭하기</a>
    </div>
</body>
</html>
